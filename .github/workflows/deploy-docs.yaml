name: deploy-docs

on:
  push:
    branches:
      - main
      - galactic
    paths:
      - mkdocs.yaml
      - "**/*.md"
      - "**/*.svg"
      - "**/*.png"
      - "**/*.jpg"
  pull_request_target:
    types:
      - opened
      - synchronize
      - labeled
  workflow_dispatch:

jobs:
  prevent-no-label-execution:
    uses: autowarefoundation/autoware-github-actions/.github/workflows/prevent-no-label-execution.yaml@v1
    with:
      label: tag:deploy-docs
    # When running manually, either do not skip the job and mark it as successful (outputs.run = ‘true’), or use conditional branching as shown below:
    if: github.event_name != 'workflow_dispatch'

  deploy-docs:
    needs: prevent-no-label-execution
    # When executed manually, or when `prevent-no-label-execution` is executed and the conditions are met
    if: always() && (github.event_name == 'workflow_dispatch' || needs.prevent-no-label-execution.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r deploy-docs/mkdocs-requirements.txt

      - name: Build docs (Not Deploy)
        run: |
          mkdocs build --clean

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-docs-html
          path: site/
